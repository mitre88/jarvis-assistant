<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src https://api.openai.com https://*.openai.com; media-src 'self' blob: mediastream:"
  />
  <title>Jarvis</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside id="session-sidebar" class="session-sidebar" aria-label="Sessions">
      <div class="session-head">
        <span class="session-head-title">Sessions</span>
        <button id="toggle-sessions" class="ghost-btn icon-btn" title="Hide sessions" type="button">⟨</button>
      </div>
      <ul id="session-list" class="session-list"></ul>
    </aside>

    <div class="hud-column">
      <header class="hud-header">
        <div class="brand">
          <span class="brand-ring" aria-hidden="true"></span>
          <span class="brand-name">JARVIS</span>
        </div>
        <div class="header-actions">
          <span id="status-chip" class="status-chip" data-state="offline">offline</span>
          <button id="show-sessions" class="ghost-btn" title="Show sessions" type="button" hidden>Sessions</button>
          <button id="new-session" class="ghost-btn" title="Start a new conversation" type="button">New session</button>
          <button id="open-settings" class="ghost-btn" title="Settings" type="button">Settings</button>
        </div>
      </header>

      <main id="feed" class="feed" aria-live="polite" role="log">
        <div id="empty-state" class="empty-state">
          <span class="empty-ring" aria-hidden="true"></span>
          <p id="empty-title" class="empty-title">Standing by.</p>
          <p class="empty-hint">Ctrl+Enter to send · Ctrl+Shift+J to summon · Esc to hide</p>
          <button id="empty-settings" class="ghost-btn" type="button" hidden>Open Settings</button>
        </div>
      </main>

      <footer class="composer">
        <button
          id="mic"
          class="mic-btn"
          data-state="off"
          title="Voice — click to listen, hold for push-to-talk (Ctrl/Cmd+Shift+Space)"
          aria-label="Toggle voice input"
          type="button"
        >
          <canvas id="orb" width="96" height="96" aria-hidden="true"></canvas>
        </button>
        <textarea
          id="input"
          class="composer-input"
          rows="2"
          placeholder="Ask Jarvis — Ctrl+Enter (⌘+Enter) to send, Esc to hide"
        ></textarea>
        <button id="send" class="send-btn" type="button">Send</button>
      </footer>
    </div>
  </div>

  <div id="settings-backdrop" class="settings-backdrop" hidden></div>
  <aside id="settings-panel" class="settings-panel" hidden>
    <div class="settings-inner">
      <h2>Settings</h2>
      <p id="settings-notice" class="settings-notice" hidden></p>

      <label>Provider
        <select id="s-provider">
          <option value="openai">OpenAI-compatible (OpenAI, Groq, Together, custom)</option>
          <option value="anthropic">Anthropic</option>
          <option value="ollama">Ollama (local)</option>
          <option value="lmstudio">LM Studio (local)</option>
        </select>
      </label>

      <label>Base URL
        <input id="s-baseurl" type="text" spellcheck="false" />
      </label>

      <label>API key
        <input id="s-apikey" type="password" spellcheck="false" autocomplete="off" />
        <span id="s-apikey-hint" class="field-hint"></span>
      </label>

      <label>Model
        <input id="s-model" type="text" list="s-models" spellcheck="false" placeholder="e.g. gpt-4o-mini, claude-sonnet-4-5, llama3.2" />
        <datalist id="s-models"></datalist>
      </label>

      <label>Organization <span class="field-optional">optional, OpenAI only</span>
        <input id="s-org" type="text" spellcheck="false" />
      </label>

      <label>Extra headers <span class="field-optional">optional, one "Name: value" per line</span>
        <textarea id="s-headers" rows="2" spellcheck="false"></textarea>
      </label>

      <label>Tool rounds <span class="field-optional">1–32, default 8</span>
        <input id="s-iterations" type="number" min="1" max="32" />
      </label>

      <label>Extra workspace roots <span class="field-optional">one path per line, besides home</span>
        <textarea id="s-roots" rows="2" spellcheck="false" placeholder="/path/to/project"></textarea>
      </label>

      <label class="check-row">
        <input id="s-tts" type="checkbox" />
        Speak replies aloud (text-to-speech)
      </label>

      <h3 class="settings-subhead">Voice input</h3>

      <label>Voice engine
        <select id="s-voice-engine">
          <option value="whisper">Local Whisper — offline, private</option>
          <option value="realtime">OpenAI Realtime — voice-to-voice</option>
        </select>
      </label>

      <div id="s-whisper-fields">
        <label>Whisper model
          <select id="s-whisper-model"></select>
        </label>
        <span id="s-model-status" class="field-hint"></span>
        <div class="settings-actions-inline">
          <button id="s-model-download" class="ghost-btn" hidden>Download</button>
          <button id="s-model-delete" class="ghost-btn" hidden>Delete</button>
          <button id="s-model-browse" class="ghost-btn" hidden>Choose file…</button>
        </div>

        <label>Spoken language
          <select id="s-stt-lang">
            <option value="en">English</option>
            <option value="auto">Auto-detect (multilingual models)</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
          </select>
        </label>
      </div>

      <div id="s-realtime-fields" hidden>
        <label>Realtime voice
          <select id="s-realtime-voice">
            <option value="marin">Marin</option>
            <option value="cedar">Cedar</option>
            <option value="alloy">Alloy</option>
            <option value="ash">Ash</option>
            <option value="ballad">Ballad</option>
            <option value="coral">Coral</option>
            <option value="echo">Echo</option>
            <option value="sage">Sage</option>
            <option value="shimmer">Shimmer</option>
            <option value="verse">Verse</option>
          </select>
        </label>
        <span class="field-hint">
          Needs an OpenAI API key with the provider set to OpenAI-compatible at api.openai.com.
        </span>
      </div>

      <div class="settings-actions">
        <button id="s-test" class="ghost-btn" type="button">Test connection</button>
        <button id="s-save" class="send-btn" type="button">Save</button>
        <button id="s-close" class="ghost-btn" type="button">Close</button>
      </div>
      <p id="s-test-result" class="test-result" hidden></p>
    </div>
  </aside>

  <div id="confirm-overlay" class="confirm-overlay" hidden>
    <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-detail">
      <h3 id="confirm-title"></h3>
      <p id="confirm-queue" class="confirm-queue" hidden></p>
      <pre id="confirm-detail"></pre>
      <div class="confirm-actions">
        <button id="confirm-deny" class="ghost-btn" type="button">Deny</button>
        <button id="confirm-approve" class="danger-btn" type="button">Approve</button>
      </div>
    </div>
  </div>

  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
